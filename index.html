<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ろあのWebサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f1eb;
      color: #2f302f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 40px auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.3;
    }

    h2 {
      margin-top: 40px;
      font-size: 22px;
    }

    a {
      color: #426879;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      main {
        margin: 12px auto;
        padding: 24px;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>ろあのWebサイト</h1>

    <p>
      はじめまして。ここは、ろあの個人サイトです。
    </p>

    <p>
      作ったものや調べたことを、少しずつ掲載していく予定です。
    </p>

    <h2>現在準備中</h2>

    <p>
      サイトの内容は、これからゆっくり整えていきます。
    </p>
  </main>
</body>
</html>
