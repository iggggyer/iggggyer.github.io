<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ろあのWebサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f1eb;
      color: #2f302f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 40px auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.3;
    }

    h2 {
      margin-top: 40px;
      font-size: 22px;
    }

    a {
      color: #426879;
    }

    .site-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .site-link {
      display: block;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      background: #f8f8f6;
      border: 1px solid #e3e2dc;
      border-radius: 12px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .site-link:hover,
    .site-link:focus-visible {
      background: #eef4f5;
      transform: translateY(-2px);
    }

    .site-link:focus-visible {
      outline: 3px solid #426879;
      outline-offset: 3px;
    }

    .site-link-title {
      display: block;
      color: #426879;
      font-size: 20px;
      font-weight: 700;
    }

    .site-link-description {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      main {
        margin: 12px auto;
        padding: 24px;
        border-radius: 12px;
      }

      .site-links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>ろあのWebサイト</h1>

    <p>
      はじめまして。ここは、ろあの個人サイトです。
    </p>

    <p>
      作ったものや調べたことを、少しずつ掲載していく予定です。
    </p>

    <h2>現在準備中</h2>

    <p>
      サイトの内容は、これからゆっくり整えていきます。
    </p>

    <h2>作品を見る</h2>

    <nav class="site-links" aria-label="作品カテゴリー">
      <a class="site-link" href="tools.html">
        <span class="site-link-title">Tools</span>
        <span class="site-link-description">便利なWebツールをまとめています。</span>
      </a>

      <a class="site-link" href="games.html">
        <span class="site-link-title">Games</span>
        <span class="site-link-description">作ったゲームをまとめています。</span>
      </a>
    </nav>
  </main>
</body>
</html>
