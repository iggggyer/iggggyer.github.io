<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games | ろあのWebサイト</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #f3f1eb;
      color: #2f302f;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }
    main {
      width: 100%;
      max-width: 720px;
      margin: 40px auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-top: 0; font-size: clamp(28px, 7vw, 42px); line-height: 1.3; }
    h2 { margin: 0; color: #426879; font-size: 22px; }
    a { color: #426879; }
    .back-link { display: inline-block; margin-bottom: 28px; }
    .game-card {
      display: block;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: #f8f8f6;
      border: 1px solid #e3e2dc;
      border-radius: 12px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .game-card:hover, .game-card:focus-visible {
      background: #eef4f5;
      transform: translateY(-2px);
    }
    .game-card:focus-visible { outline: 3px solid #426879; outline-offset: 3px; }
    .game-card p { margin: 8px 0 0; }
    .play { display: inline-block; margin-top: 16px; color: #426879; font-weight: 700; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      main { margin: 12px auto; padding: 24px; border-radius: 12px; }
      .game-card { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="index.html">← トップページへ戻る</a>
    <h1>Games</h1>
    <p>作ったゲームを掲載しています。</p>

    <a class="game-card" href="games/modelgame/">
      <h2>モケイ・マイスター 30DAYS</h2>
      <p>30日間で戦車模型を完成させ、コンテストを目指すレトロゲーム風シミュレーション。</p>
      <span class="play">ゲームをはじめる →</span>
    </a>
  </main>
</body>
</html>
